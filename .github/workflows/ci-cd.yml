name: CI/CD

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  CLUSTER_ID: 374579d5-cdca-43cc-9f0a-832461d46486
  REGISTRY: registry.digitalocean.com/usv-twa-project
  BACKEND_IMAGE: shopping-list-backend
  FRONTEND_IMAGE: shopping-list-frontend
  APP_NAMESPACE: shopping-list
  TRAEFIK_NAMESPACE: traefik
  APP_URL: https://mihail-musteata.mibo.monster

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate backend imports
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          python -m compileall backend/app

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
        run: |
          test -n "$DIGITALOCEAN_ACCESS_TOKEN"
          test -n "$APP_SECRET_KEY"

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build and push backend image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t "$REGISTRY/$BACKEND_IMAGE:$GITHUB_SHA" \
            -t "$REGISTRY/$BACKEND_IMAGE:latest" \
            ./backend \
            --push

      - name: Build and push frontend image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f frontend/Dockerfile.k8s \
            --build-arg VITE_API_URL=/api \
            -t "$REGISTRY/$FRONTEND_IMAGE:$GITHUB_SHA" \
            -t "$REGISTRY/$FRONTEND_IMAGE:latest" \
            ./frontend \
            --push

      - name: Configure Kubernetes access
        run: doctl kubernetes cluster kubeconfig save "$CLUSTER_ID"

      - name: Prepare Kubernetes secrets
        env:
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          APP_REFRESH_SECRET_KEY: ${{ secrets.APP_REFRESH_SECRET_KEY }}
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl -n "$APP_NAMESPACE" create secret generic shopping-list-secret \
            --from-literal=SECRET_KEY="$APP_SECRET_KEY" \
            --from-literal=REFRESH_SECRET_KEY="${APP_REFRESH_SECRET_KEY:-$APP_SECRET_KEY}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -
          doctl registry kubernetes-manifest --namespace "$APP_NAMESPACE" | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/backend.yaml
          kubectl apply -f k8s/frontend.yaml
          kubectl apply -f k8s/traefik.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Deploy image tags
        run: |
          kubectl -n "$APP_NAMESPACE" set image deployment/shopping-list-backend \
            backend="$REGISTRY/$BACKEND_IMAGE:$GITHUB_SHA"
          kubectl -n "$APP_NAMESPACE" set image deployment/shopping-list-frontend \
            frontend="$REGISTRY/$FRONTEND_IMAGE:$GITHUB_SHA"

      - name: Wait for rollout
        run: |
          kubectl -n "$APP_NAMESPACE" rollout status deployment/shopping-list-backend --timeout=180s
          kubectl -n "$APP_NAMESPACE" rollout status deployment/shopping-list-frontend --timeout=180s
          kubectl -n "$TRAEFIK_NAMESPACE" rollout status deployment/traefik --timeout=180s

      - name: Smoke test
        run: |
          curl --fail --show-error --silent "$APP_URL/api/healthz"
