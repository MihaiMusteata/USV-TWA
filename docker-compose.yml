services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: shopping_list
      POSTGRES_USER: shopping
      POSTGRES_PASSWORD: shopping
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: "schimba-acest-secret-in-productie"
      REFRESH_SECRET_KEY: "schimba-acest-refresh-secret-in-productie"
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      DATABASE_URL: "postgresql://shopping:shopping@postgres:5432/shopping_list"
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:8000"
    depends_on:
      - backend

volumes:
  postgres-data:
