services:
  - type: web
    name: shopping-list-api
    runtime: docker
    rootDir: backend
    plan: starter
    autoDeployTrigger: commit
    healthCheckPath: /healthz
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_PATH
        value: /data/shopping.db
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://shopping-list-frontend.onrender.com

  - type: web
    name: shopping-list-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://shopping-list-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
